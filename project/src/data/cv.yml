# The CV is maintained here and nowhere else. Both language versions of
# /cv.html are generated from this file. Titles of theses, papers and posts
# stay in their original language, as is normal on an academic CV; only the
# section headings and connective words are translated (see build.js).

# PDF versions, listed at the top of the CV page in this order. Each link only
# appears if its file is actually in src/assets/pdfs/, so you can ship one
# before the other without a dead link. `key` picks the label out of ui.yml
# (cvDownloads), which is translated for every language.
downloads:
  - file: industry.pdf
    key: industry
  - file: academic.pdf
    key: academic

