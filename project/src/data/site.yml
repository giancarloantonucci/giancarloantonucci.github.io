# Site-level configuration. Nothing here needs a code change to alter.
#
# The other data files answer "what are the languages", "what is on the CV",
# "what do the labels say". This one answers "how is the site arranged".

# Full public URL of the site root, with a trailing slash. Used for sitemap.xml,
# robots.txt and the 404 page. GitHub Actions overrides this with the real Pages
# URL via the SITE_URL environment variable, so this value matters mainly for
# local builds.
url: https://giancarloantonucci.github.io/

# The language the bare site root redirects to, and the one hreflang declares as
# x-default. Must be a code in languages.yml.
defaultLanguage: en

# The navigation bar, left to right. Each entry is a folder under src/pages/,
# except `cv`, which is generated from cv.yml. A page appears only in the
# languages it has been written in, so listing it here is safe before it exists
# in every language. Every entry needs a label under `nav` in ui.yml.
nav:
  - index
  - research
  - collaborations
  - cv
  - notebook

# Notebook groupings, in the order they appear on the page. A post declares one
# of these as `section:` in its _page.yml. Sections with no posts are skipped,
# so adding one here early costs nothing. Every entry needs a label under
# `postSections` in ui.yml.
postSections:
  - maths
  - linguistics
  - poetry
