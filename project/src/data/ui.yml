# Interface strings — one block per language code in languages.yml.
# Page content lives in src/pages/; this file is only the chrome.
#
# Every language must carry the same keys as en, and the ids under nav,
# cvSections, cvDownloads and postSections must match the ids defined in
# build.js and cv.yml. The build checks all of that and refuses to run if
# anything has drifted, so you cannot silently ship a blank label.
#
# _REVIEW / _TODO mark blocks that still need a speaker to look at them.

