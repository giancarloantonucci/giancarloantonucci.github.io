<!DOCTYPE html>
<html lang="{{langTag}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{descriptionMeta}}
  <title>G. A. Antonucci — {{title}}</title>
  <link rel="preload" href="{{assets}}/fonts/EBGaramond-Roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{assets}}/fonts/BodoniModa-Roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{assets}}/styles.css">
  <script>
    // Runs before paint so a stored choice doesn't flash the other theme.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  {{alternates}}
  {{head}}
</head>
<body>
  <a class="skip-link" href="#main">{{skip}}</a>

  <nav class="navbar">
    <div class="nav-links">
        {{nav}}
    </div>
    <div class="nav-tools">
      <button class="theme-toggle" type="button" aria-label="{{themeLabel}}" title="{{themeLabel}}">
        <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 110-10 5 5 0 010 10zm0-13.2a1 1 0 01-1-1V1a1 1 0 012 0v1.8a1 1 0 01-1 1zm0 18.4a1 1 0 01-1-1V19.4a1 1 0 012 0v1.8a1 1 0 01-1 1zM3.8 12a1 1 0 01-1 1H1a1 1 0 010-2h1.8a1 1 0 011 1zm18.4 0a1 1 0 01-1 1h-1.8a1 1 0 010-2H21a1 1 0 011 1zM5.6 5.6a1 1 0 01-1.4 0L3 4.4A1 1 0 014.4 3l1.2 1.2a1 1 0 010 1.4zm13.8 13.8a1 1 0 01-1.4 0l-1.2-1.2a1 1 0 011.4-1.4l1.2 1.2a1 1 0 010 1.4zM4.2 19.4a1 1 0 010-1.4l1.2-1.2a1 1 0 011.4 1.4l-1.2 1.2a1 1 0 01-1.4 0zM17.2 6.4a1 1 0 010-1.4L18.4 3.8A1 1 0 0119.8 5.2l-1.2 1.2a1 1 0 01-1.4 0z"/></svg>
        <svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13.2A9 9 0 1110.8 3a7 7 0 1010.2 10.2z"/></svg>
      </button>
    <div class="dropdown">
      <button class="dropdown-button" type="button" aria-expanded="false" aria-controls="language-selector">
        <span>{{language}}</span>
        <svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0l5 6 5-6z" fill="currentColor"/></svg>
      </button>
      <div id="language-selector" class="dropdown-content" role="menu" aria-label="{{switchLabel}}">
        {{languageOptions}}
      </div>
    </div>
    </div>
  </nav>

  <div class="content-wrapper">
    <header class="content masthead">
      <img src="{{assets}}/images/profile-picture.jpg" class="portrait" width="248" height="248" decoding="async" alt="Giancarlo Antonino Antonucci">
      <div class="masthead-text">
        <h1>Giancarlo Antonino<br>Antonucci, PhD</h1>
      </div>
    </header>

    <main class="content" id="main">
      <div class="prose">
        {{renderedContent}}
      </div>

      <div class="contact">
        <a class="contact-link" href="mailto:giancarlo.antonucci@ukaea.uk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5a2 2 0 012-2h16a2 2 0 012 2v14a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm2.2.9L12 12l7.8-6.1H4.2zM20 8.1l-7.4 5.8a1 1 0 01-1.2 0L4 8.1V19h16V8.1z"/></svg>
          <span>Email</span>
        </a>
        <a class="contact-link" href="https://www.linkedin.com/in/giancarloantonucci" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5 2.5 2.5 0 01.02-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.45-2.2 2.96V21H9z"/></svg>
          <span>LinkedIn</span>
        </a>
        <a class="contact-link" href="https://github.com/giancarloantonucci" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 00-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 015 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.755c0 .27.18.58.69.48A10 10 0 0012 2z"/></svg>
          <span>GitHub</span>
        </a>
        <a class="contact-link" href="cv.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm0 2.5L17.5 8H14V4.5zM8 13h8v1.6H8V13zm0 3.4h8V18H8v-1.6zM8 9.6h4v1.6H8V9.6z"/></svg>
          <span>CV</span>
        </a>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    © {{year}} Giancarlo Antonino Antonucci
  </footer>

  {{inlineScript}}
</body>
</html>
