<!DOCTYPE html>
<html lang="{{langTag}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{descriptionMeta}}
  <title>Giancarlo Antonino Antonucci</title>
  <link rel="preload" href="{{assets}}/fonts/Literata-Roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{assets}}/styles.css">
  <script>
    // Runs before paint so a stored choice doesn't flash the other theme.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  {{alternates}}
  {{head}}
</head>
<body>
  <a class="skip-link" href="#main">{{skip}}</a>

  <nav class="navbar">
    <div class="nav-links">
        {{nav}}
    </div>
    <div class="nav-tools">
      <button class="theme-toggle" type="button" aria-label="{{themeLabel}}" title="{{themeLabel}}">
        <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3m0-2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.37 5.51c-.18.64-.27 1.31-.27 1.99 0 4.08 3.32 7.4 7.4 7.4.68 0 1.35-.09 1.99-.27C17.45 17.19 14.93 19 12 19c-3.86 0-7-3.14-7-7 0-2.93 1.81-5.45 4.37-6.49zM12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    <nav class="lang-flags" aria-label="{{switchLabel}}">
        {{languageFlags}}
    </nav>
    <div class="dropdown">
      <button class="dropdown-button" type="button" aria-expanded="false" aria-controls="language-selector" aria-label="{{switchLabel}}" title="{{switchLabel}}">
        {{currentFlag}}
        <svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0l5 6 5-6z" fill="currentColor"/></svg>
      </button>
      <div id="language-selector" class="dropdown-content" role="menu" aria-label="{{switchLabel}}">
        {{languageOptions}}
      </div>
    </div>
    </div>
  </nav>

  <div class="content-wrapper">
    <header class="content masthead">
      <img src="{{assets}}/images/profile-picture.jpg" class="portrait" width="248" height="248" decoding="async" alt="Giancarlo Antonino Antonucci">
      <div class="masthead-text">
        <h1><span class="name-first">Giancarlo Antonino</span><br>Antonucci, PhD</h1>
      </div>
    </header>

    <main class="content" id="main">
      <div class="prose">
        {{renderedContent}}
      </div>

      <div class="contact">
        <a class="contact-link" href="mailto:giancarlo.antonucci@ukaea.uk">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5a2 2 0 012-2h16a2 2 0 012 2v14a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm2.2.9L12 12l7.8-6.1H4.2zM20 8.1l-7.4 5.8a1 1 0 01-1.2 0L4 8.1V19h16V8.1z"/></svg>
          <span>Email</span>
        </a>
        <a class="contact-link" href="https://www.linkedin.com/in/giancarloantonucci" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5 2.5 2.5 0 01.02-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.45-2.2 2.96V21H9z"/></svg>
          <span>LinkedIn</span>

        <a class="contact-link" href="https://github.com/giancarloantonucci" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 00-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 015 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.755c0 .27.18.58.69.48A10 10 0 0012 2z"/></svg>
          <span>GitHub</span>
        </a>
        <a class="contact-link" href="cv.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm0 2.5L17.5 8H14V4.5zM8 13h8v1.6H8V13zm0 3.4h8V18H8v-1.6zM8 9.6h4v1.6H8V9.6z"/></svg>
          <span>CV</span>
        </a>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    © {{year}} Giancarlo Antonino Antonucci
  </footer>

  {{inlineScript}}
</body>
</html>
